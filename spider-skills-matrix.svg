<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0A0D12"/>
    </linearGradient>
    <linearGradient id="barRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D31F1F"/>
      <stop offset="100%" stop-color="#FF1E26"/>
    </linearGradient>
    <linearGradient id="barBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#165DFF"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>
    <linearGradient id="barYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD500"/>
      <stop offset="100%" stop-color="#FFAA00"/>
    </linearGradient>
    <linearGradient id="barPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="barCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <style>
    .header-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 800; font-size: 9px; fill: #FFD500; letter-spacing: 1.5px; }
    .header-main { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 900; font-size: 14px; fill: #FFFFFF; letter-spacing: 1px; }
    .lang-name { font-family: 'JetBrains Mono', Consolas, monospace; font-weight: 700; font-size: 11px; fill: #E6EDF3; }
    .lang-pct { font-family: 'JetBrains Mono', Consolas, monospace; font-weight: 700; font-size: 11px; fill: #8B949E; }
  </style>

  <!-- Background -->
  <rect x="2" y="2" width="396" height="316" rx="14" fill="url(#bgGrad2)" stroke="#165DFF" stroke-width="2" />

  <!-- Corner Brackets -->
  <path d="M 10 24 L 10 10 L 24 10" stroke="#FFD500" stroke-width="2.5" fill="none"/>
  <path d="M 390 24 L 390 10 L 376 10" stroke="#FFD500" stroke-width="2.5" fill="none"/>
  <path d="M 10 296 L 10 310 L 24 310" stroke="#D31F1F" stroke-width="2.5" fill="none"/>
  <path d="M 390 296 L 390 310 L 376 310" stroke="#D31F1F" stroke-width="2.5" fill="none"/>

  <!-- Header -->
  <g transform="translate(20, 22)">
    <circle cx="16" cy="16" r="14" fill="#165DFF" stroke="#00D2FF" stroke-width="1.5"/>
    <text x="16" y="21" text-anchor="middle" font-size="14">⚡</text>
    <text x="40" y="13" class="header-sub">MULTIVERSE MASTERY</text>
    <text x="40" y="28" class="header-main">TOP TECH STACK</text>
  </g>

  <!-- Divider -->
  <line x1="20" y1="68" x2="380" y2="68" stroke="#30363D" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Skills Bars -->
  <g transform="translate(20, 84)">
    <!-- 1. React & Next.js -->
    <text x="0" y="10" class="lang-name">React / Next.js</text>
    <text x="360" y="10" text-anchor="end" class="lang-pct">95%</text>
    <rect x="0" y="16" width="360" height="7" rx="3.5" fill="#21262D"/>
    <rect x="0" y="16" width="342" height="7" rx="3.5" fill="url(#barBlue)"/>

    <!-- 2. TypeScript / JavaScript -->
    <text x="0" y="48" class="lang-name">TypeScript / JavaScript</text>
    <text x="360" y="48" text-anchor="end" class="lang-pct">90%</text>
    <rect x="0" y="54" width="360" height="7" rx="3.5" fill="#21262D"/>
    <rect x="0" y="54" width="324" height="7" rx="3.5" fill="url(#barYellow)"/>

    <!-- 3. Tailwind CSS / UI Styling -->
    <text x="0" y="86" class="lang-name">Tailwind CSS / UI Motion</text>
    <text x="360" y="86" text-anchor="end" class="lang-pct">92%</text>
    <rect x="0" y="92" width="360" height="7" rx="3.5" fill="#21262D"/>
    <rect x="0" y="92" width="331" height="7" rx="3.5" fill="url(#barCyan)"/>

    <!-- 4. Node.js & Backend APIs -->
    <text x="0" y="124" class="lang-name">Node.js / Express / SQL</text>
    <text x="360" y="124" text-anchor="end" class="lang-pct">85%</text>
    <rect x="0" y="130" width="360" height="7" rx="3.5" fill="#21262D"/>
    <rect x="0" y="130" width="306" height="7" rx="3.5" fill="url(#barRed)"/>

    <!-- 5. 3D Blender / Video Editing -->
    <text x="0" y="162" class="lang-name">Blender 3D / Video Editing</text>
    <text x="360" y="162" text-anchor="end" class="lang-pct">88%</text>
    <rect x="0" y="168" width="360" height="7" rx="3.5" fill="#21262D"/>
    <rect x="0" y="168" width="316" height="7" rx="3.5" fill="url(#barPurple)"/>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(20, 282)">
    <rect x="0" y="0" width="360" height="24" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="180" y="16" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="700" fill="#FFD500">
      ⚡ 60 FPS • PRODUCTION-READY • CLEAN CODE ⚡
    </text>
  </g>
</svg>
