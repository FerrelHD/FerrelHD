<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0A0D12"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .t-main { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 900; font-size: 13px; fill: #FFFFFF; letter-spacing: 0.8px; }
    .t-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 800; font-size: 9px; fill: #FFD500; letter-spacing: 1.5px; }
    .lbl { font-family: 'JetBrains Mono', Consolas, monospace; font-weight: 700; font-size: 10px; fill: #8B949E; }
    .val { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 800; font-size: 11px; fill: #FFFFFF; }
    .code { font-family: 'JetBrains Mono', Consolas, monospace; font-weight: 700; font-size: 10px; fill: #58A6FF; }
    .status-text { font-family: 'JetBrains Mono', Consolas, monospace; font-weight: 800; font-size: 9px; fill: #10B981; }
  </style>

  <!-- Background -->
  <rect x="2" y="2" width="396" height="316" rx="14" fill="url(#bgGrad1)" stroke="#D31F1F" stroke-width="2" />

  <!-- Corner Brackets -->
  <path d="M 10 24 L 10 10 L 24 10" stroke="#FFD500" stroke-width="2.5" fill="none"/>
  <path d="M 390 24 L 390 10 L 376 10" stroke="#FFD500" stroke-width="2.5" fill="none"/>
  <path d="M 10 296 L 10 310 L 24 310" stroke="#165DFF" stroke-width="2.5" fill="none"/>
  <path d="M 390 296 L 390 310 L 376 310" stroke="#165DFF" stroke-width="2.5" fill="none"/>

  <!-- Header -->
  <g transform="translate(18, 20)">
    <circle cx="16" cy="16" r="14" fill="#D31F1F" stroke="#FFD500" stroke-width="1.5"/>
    <text x="16" y="21" text-anchor="middle" font-size="14">🕷️</text>
    <text x="38" y="13" class="t-sub">PARKER LABS TELEMETRY</text>
    <text x="38" y="28" class="t-main">HERO STATUS: ACTIVE</text>
    
    <!-- Status Pill -->
    <rect x="265" y="6" width="98" height="20" rx="10" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
    <circle cx="277" cy="16" r="3" fill="#10B981" filter="url(#glow1)"/>
    <text x="286" y="19" class="status-text">OPEN TO WORK</text>
  </g>

  <!-- Divider -->
  <line x1="18" y1="68" x2="382" y2="68" stroke="#30363D" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Telemetry Content -->
  <g transform="translate(20, 84)">
    <text x="0" y="12" class="lbl">OPERATIVE:</text>
    <text x="0" y="26" class="val">Ferrel Rashad Akeyla</text>

    <text x="0" y="52" class="lbl">ROLE / CLASS:</text>
    <text x="0" y="66" class="val">Full-Stack Web Dev &amp; Creative Tech</text>

    <text x="0" y="92" class="lbl">BASE / LOCATION:</text>
    <text x="0" y="106" class="val">Indonesia 🇮🇩 (Available Globally)</text>

    <text x="0" y="132" class="lbl">CORE WEAPONS:</text>
    <text x="0" y="146" class="code">React 19 • Next.js • TS • Tailwind</text>

    <text x="0" y="172" class="lbl">CREATIVE ARSENAL:</text>
    <text x="0" y="186" class="code">Figma • Blender 3D • Premiere • Unity</text>
  </g>

  <!-- Bottom Box -->
  <g transform="translate(18, 278)">
    <rect x="0" y="0" width="364" height="28" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="182" y="18" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="700" fill="#E6EDF3">
      "With Great Power, Comes Great Code" 🕸️
    </text>
  </g>
</svg>
