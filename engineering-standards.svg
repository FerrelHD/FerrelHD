<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgEng" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="60%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0A0D12"/>
    </linearGradient>
    <filter id="glowEng" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .t-main { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 900; font-size: 13.5px; fill: #FFFFFF; letter-spacing: 0.8px; }
    .t-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 800; font-size: 9px; fill: #FFD500; letter-spacing: 1.5px; }
    .lbl { font-family: 'JetBrains Mono', Consolas, monospace; font-weight: 700; font-size: 10px; fill: #8B949E; }
    .val { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 800; font-size: 11.5px; fill: #FFFFFF; }
    .highlight-blue { font-family: 'JetBrains Mono', Consolas, monospace; font-weight: 700; font-size: 10.5px; fill: #58A6FF; }
    .highlight-yellow { font-family: 'JetBrains Mono', Consolas, monospace; font-weight: 700; font-size: 10.5px; fill: #FFD500; }
    .status-badge { font-family: 'JetBrains Mono', Consolas, monospace; font-weight: 800; font-size: 9px; fill: #10B981; }
  </style>

  <!-- Card Background -->
  <rect x="2" y="2" width="436" height="336" rx="14" fill="url(#bgEng)" stroke="#D31F1F" stroke-width="2" />

  <!-- Corner Comic Accents -->
  <path d="M 12 26 L 12 12 L 26 12" stroke="#FFD500" stroke-width="2.5" fill="none"/>
  <path d="M 428 26 L 428 12 L 414 12" stroke="#FFD500" stroke-width="2.5" fill="none"/>
  <path d="M 12 314 L 12 328 L 26 328" stroke="#165DFF" stroke-width="2.5" fill="none"/>
  <path d="M 428 314 L 428 328 L 414 328" stroke="#165DFF" stroke-width="2.5" fill="none"/>

  <!-- Header -->
  <g transform="translate(20, 20)">
    <circle cx="16" cy="16" r="14" fill="#D31F1F" stroke="#FFD500" stroke-width="1.5"/>
    <text x="16" y="21" text-anchor="middle" font-size="14">⚙️</text>
    <text x="40" y="13" class="t-sub">ENGINEERING STANDARDS</text>
    <text x="40" y="28" class="t-main">CORE ARCHITECTURE &amp; STACK</text>
    
    <!-- Status Pill -->
    <rect x="290" y="6" width="105" height="20" rx="10" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
    <circle cx="302" cy="16" r="3" fill="#10B981" filter="url(#glowEng)"/>
    <text x="312" y="19" class="status-badge">OPEN TO WORK</text>
  </g>

  <!-- Divider -->
  <line x1="20" y1="68" x2="420" y2="68" stroke="#30363D" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Specifications List -->
  <g transform="translate(22, 82)">
    <!-- 1. Architecture -->
    <text x="0" y="12" class="lbl">🏗️ ARCHITECTURE PATTERNS</text>
    <text x="0" y="27" class="val">Component-Driven • Zero-Bloat stdlib • YAGNI</text>

    <!-- 2. Performance -->
    <text x="0" y="55" class="lbl">⚡ PERFORMANCE BENCHMARKS</text>
    <text x="0" y="70" class="highlight-yellow">60 FPS Fluid UI • High Lighthouse Web Vitals</text>

    <!-- 3. Primary Stack -->
    <text x="0" y="98" class="lbl">🛠️ PRIMARY WEB ECOSYSTEM</text>
    <text x="0" y="113" class="highlight-blue">React 19 • Next.js • TypeScript • Tailwind CSS</text>

    <!-- 4. Backend & Data -->
    <text x="0" y="141" class="lbl">🔒 BACKEND &amp; PIPELINES</text>
    <text x="0" y="156" class="val">Node.js API • PostgreSQL • MySQL • RESTful Systems</text>

    <!-- 5. Code Quality -->
    <text x="0" y="184" class="lbl">🎯 ENGINEERING PHILOSOPHY</text>
    <text x="0" y="199" class="highlight-blue">Pragmatic, Type-Safe, Readable &amp; Maintainable</text>
  </g>

  <!-- Footer Banner -->
  <g transform="translate(20, 296)">
    <rect x="0" y="0" width="400" height="26" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="200" y="17" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="700" fill="#FFD500">
      ⚡ CLEAN ARCHITECTURE • HIGH-IMPACT CODE ⚡
    </text>
  </g>
</svg>
