<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMatrix" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="60%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0A0D12"/>
    </linearGradient>
  </defs>

  <style>
    .t-main { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 900; font-size: 13.5px; fill: #FFFFFF; letter-spacing: 0.8px; }
    .t-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 800; font-size: 9px; fill: #FFD500; letter-spacing: 1.5px; }
    .lbl { font-family: 'JetBrains Mono', Consolas, monospace; font-weight: 700; font-size: 10px; fill: #8B949E; }
    .val { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 800; font-size: 11.5px; fill: #FFFFFF; }
    .highlight-purple { font-family: 'JetBrains Mono', Consolas, monospace; font-weight: 700; font-size: 10.5px; fill: #C084FC; }
    .highlight-cyan { font-family: 'JetBrains Mono', Consolas, monospace; font-weight: 700; font-size: 10.5px; fill: #38BDF8; }
    .highlight-green { font-family: 'JetBrains Mono', Consolas, monospace; font-weight: 700; font-size: 10.5px; fill: #34D399; }
    .level-badge { font-family: 'JetBrains Mono', Consolas, monospace; font-weight: 800; font-size: 9px; fill: #165DFF; }
  </style>

  <!-- Card Background -->
  <rect x="2" y="2" width="436" height="336" rx="14" fill="url(#bgMatrix)" stroke="#165DFF" stroke-width="2" />

  <!-- Corner Comic Accents -->
  <path d="M 12 26 L 12 12 L 26 12" stroke="#FFD500" stroke-width="2.5" fill="none"/>
  <path d="M 428 26 L 428 12 L 414 12" stroke="#FFD500" stroke-width="2.5" fill="none"/>
  <path d="M 12 314 L 12 328 L 26 328" stroke="#D31F1F" stroke-width="2.5" fill="none"/>
  <path d="M 428 314 L 428 328 L 414 328" stroke="#D31F1F" stroke-width="2.5" fill="none"/>

  <!-- Header -->
  <g transform="translate(20, 20)">
    <circle cx="16" cy="16" r="14" fill="#165DFF" stroke="#00D2FF" stroke-width="1.5"/>
    <text x="16" y="21" text-anchor="middle" font-size="14">🎨</text>
    <text x="40" y="13" class="t-sub">DISCIPLINE MATRIX</text>
    <text x="40" y="28" class="t-main">CREATIVE TECH &amp; MEDIA</text>
    
    <!-- Multi-Role Pill -->
    <rect x="290" y="6" width="105" height="20" rx="10" fill="#165DFF" fill-opacity="0.15" stroke="#165DFF" stroke-width="1"/>
    <text x="342" y="19" text-anchor="middle" class="level-badge">MULTI-TALENT</text>
  </g>

  <!-- Divider -->
  <line x1="20" y1="68" x2="420" y2="68" stroke="#30363D" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Capabilities List -->
  <g transform="translate(22, 82)">
    <!-- 1. Full-Stack Web -->
    <text x="0" y="12" class="lbl">🌐 FULL-STACK WEB CRAFT</text>
    <text x="0" y="27" class="highlight-cyan">SPA / SSR Apps • REST APIs • Responsive UI</text>

    <!-- 2. Video & Motion -->
    <text x="0" y="55" class="lbl">🎬 CINEMATIC VIDEO &amp; MOTION</text>
    <text x="0" y="70" class="highlight-purple">Pacing • Color Grading • Dynamic Sound FX</text>

    <!-- 3. 3D Modeling -->
    <text x="0" y="98" class="lbl">🧊 3D ASSET DESIGN (BLENDER)</text>
    <text x="0" y="113" class="val">Hard-Surface Models • Texturing • Multiverse Renders</text>

    <!-- 4. Game Systems -->
    <text x="0" y="141" class="lbl">🕹️ GAME SYSTEMS (UNITY &amp; CANVAS)</text>
    <text x="0" y="156" class="highlight-green">Unity C# Combat Mechanics • HTML5 Arcade Games</text>

    <!-- 5. UI/UX Design -->
    <text x="0" y="184" class="lbl">📐 UI/UX DESIGN (FIGMA)</text>
    <text x="0" y="199" class="val">Design Systems • Comic Pop-Art • Wireframing</text>
  </g>

  <!-- Footer Banner -->
  <g transform="translate(20, 296)">
    <rect x="0" y="0" width="400" height="26" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="200" y="17" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="700" fill="#38BDF8">
      ⚡ BRIDGING CODE, 3D IMMERSION &amp; CINEMATIC FLOW ⚡
    </text>
  </g>
</svg>
